# A TOML linter such as Tombi can use this schema to validate your config.
# If you encounter any problems, please file an issue at https://github.com/yazi-rs/schemas.

#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
# ratio          = [ 1, 4, 3 ]
ratio          = [ 2, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse 	 = false
sort_dir_first = true
sort_translit  = false
sort_fallback  = "alphabetical"
linemode       = "none"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll", "drag" ]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "yes"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 100
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
  { run = 'neovide %s',    orphan = true, desc = "Neovide",      for = "unix" },
  { run = 'ghostty -e vim "%s"', orphan = true, desc = "Neovim (Ghostty)", for = "unix" },
  { run = 'alacritty -e vim "%s"', orphan = true, desc = "Neovim (Alacritty)", for = "unix" },
  { run = 'wezterm start --always-new-process -e vim "%s"', orphan = true, desc = "Neovim (WezTerm)", for = "unix" },
  { run = 'kitty -e vim "%s"', orphan = true, desc = "Neovim (Kitty)", for = "unix" },

  { run = 'ghostty -e hx "%s"', orphan = true, desc = "Helix (Ghostty)", for = "unix" },
  { run = 'alacritty -e hx "%s"', orphan = true, desc = "Helix (Alacritty)", for = "unix" },
  { run = 'wezterm start --always-new-process -e hx "%s"', orphan = true, desc = "Helix (WezTerm)", for = "unix" },
  { run = 'kitty -e hx "%s"', orphan = true, desc = "Helix (Kitty)", for = "unix" },

  { run = 'emacs "%s"', orphan = true, desc = "Emacsclient", for = "unix" },
  { run = 'code %s',    orphan = true, desc = "VSCode",      for = "unix" },
  { run = '~/.config/emacs/bin/doom emacs "%s"', orphan = true, desc = "Doom Emacs", for = "unix" },
	{ run = 'ghostty -e fresh "%s"', orphan = true, desc = "fresh", for = "unix" },
	{ run = 'alacritty -e micro "%s"', orphan = true, desc = "micro", for = "unix" },
	{ run = 'code %s*',    orphan = true, desc = "VSCode",           for = "windows" },
	{ run = 'code -w %s*', block = true,  desc = "VSCode (block)",   for = "windows" },
#  { run = "${EDITOR:-vi} %s", desc = "$EDITOR",      for = "unix", block = true },
#	{ run = "code %s",          desc = "code",         for = "windows", orphan = true },
#	{ run = "code -w %s",       desc = "code (block)", for = "windows", block = true },
]
play = [
	{ run = "xdg-open %s1",    desc = "Play", for = "linux", orphan = true },
	{ run = "open %s",         desc = "Play", for = "macos" },
	{ run = 'start "" %s1',    desc = "Play", for = "windows", orphan = true },
	{ run = "termux-open %s1", desc = "Play", for = "android" },
	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
	{ run = "mediainfo %s1 & pause", block = true, desc = "Show media info", for = "windows" },
]
open = [
	{ run = "xdg-open %s1",    desc = "Open System default", for = "linux" },
	{ run = "open %s",         desc = "Open", for = "macos" },
	{ run = 'start "" %s1',    desc = "Open", for = "windows", orphan = true },
	{ run = "termux-open %s1", desc = "Open", for = "android" },
]
reveal = [
  { run = "engrampa --add %s", block = true, desc = "Create archive (Engrampa)",  for = "linux" },
	{ run = 'ouch compress %s %s.zip', desc = "Create archive (ouch)",                for = "linux" },
	{ run = "thunar $(dirname %s)", desc = "Thunar", for = "linux" },
#	# { run = 'xdg-open "$(dirname "$1")"', desc = "Other File Manager", for = "linux" },
#	{ run = 'open -R "%s1"', desc = "Reveal", for = "macos" },
#	{ run = 'explorer /select, "%s1"', orphan = true, desc = "Reveal", for = "windows" },
#	{ run = '''exiftool "%s1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },

	{ run = "xdg-open %d1",         desc = "Reveal", for = "linux" },
	{ run = "open -R %s1",          desc = "Reveal", for = "macos" },
	{ run = "explorer /select,%s1", desc = "Reveal", for = "windows", orphan = true },
	{ run = "termux-open %d1",      desc = "Reveal", for = "android" },
	{ run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", desc = "Show EXIF", for = "unix", block = true },
]
video = [
	{ run = 'smplayer %s',           orphan = true, desc = "SMplayer", for = "unix" },
	{ run = 'vlc %s',                orphan = true, desc = "VLC",      for = "unix" },
	{ run = 'mpv --force-window %s', orphan = true, desc = "mpv",      for = "unix" },
	{ run = 'avidemux %s',           orphan = true, desc = "Avidemux", for = "unix" },
	{ run = 'soundconverter %s', orphan = true, desc = "SoundConverter", for = "unix" },
	{ run = 'mpv --force-window %s1', orphan = true,                    for = "windows" },
	{ run = '''mediainfo %s1; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
audio = [
	{ run = 'deadbeef %s',           orphan = true, desc = "DeaDBeeF",       for = "unix" },
	{ run = 'smplayer %s',           orphan = true, desc = "SMplayer",       for = "unix" },
	{ run = 'vlc %s',                orphan = true, desc = "VLC",            for = "unix" },
	{ run = 'mpv --force-window %s', orphan = true, desc = "mpv",            for = "unix" },
	{ run = 'audacity %s',           orphan = true, desc = "Audacity",       for = "unix" },
	{ run = 'soundconverter %s',     orphan = true, desc = "SoundConverter", for = "unix" },
#	{ run = 'mpv --force-window "%s1"', orphan = true,                          for = "windows" },
	{ run = '''mediainfo $s1; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
image = [
	{ run = 'qview %s', orphan = true, desc = "qView", for = "unix" },
	{ run = 'photocraft %s',  orphan = true, desc = "PhotoCraft",  for = "unix" },
	{ run = 'gimp %s',  orphan = true, desc = "GIMP",  for = "unix" },
	{ run = '''mediainfo %s1; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
torrent = [
	{ run = 'qbittorrent %s', orphan = true, desc = "qBittorrent", for = "unix" },
	{ run = 'tixati %s',      orphan = true, desc = "Tixati",      for = "unix" },
	{ run = '''mediainfo %s1; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
font = [
	{ run = 'gnome-font-viewer %s', orphan = true, desc = "Show font", for = "linux" },
]
archive = [
	{ run = "engrampa %s",    desc = "Show archive (Engrampa)", for = "linux" },
    { run = 'engrampa -f %s', desc = "Extract here (Engrampa)", for = "linux" },
	{ run = "ouch d -y %s",   desc = "Extract here (ouch)",     for = "unix" },
	{ run = 'unar %s',        desc = "Extract here (unar)",     for = "unix" },
	{ run = 'unar %s',        desc = "Extract here (unar)",     for = "windows" },
]
pdf_djvu = [
	{ run = 'zathura %s',  orphan = true, desc = "Zathura",  for = "linux" },
	{ run = 'qpdfview %s', orphan = true, desc = "qpdfview", for = "linux" },
]
ebook = [
    { run = 'foliate %s',  orphan = true, desc = "Foliate",  for = "linux" },
	{ run = 'FBReader %s', orphan = true, desc = "FBReader", for = "linux" },
	{ run = 'bookworm %s', orphan = true, desc = "Bookworm", for = "linux" },
]
# bulk-rename = [
#     { run   = 'wezterm start --always-new-process -e vim "%s"', block = true },
# ]
extract = [
 	{ run = "ya pub extract --list %s", desc = "Extract here" },
]
download = [
	{ run = "ya emit download --open %S", desc = "Download and open" },
	{ run = "ya emit download %S",        desc = "Download" },
]
trash = [
	{ run = "ya pub trash-restore --list %S", desc = "Restore selected files" },
	{ run = "ya pub trash-empty --list %S",   desc = "Empty trash bin" },
]

[open]
rules = [
#   { name = "bulk-rename.txt", use = [ "bulk-rename" ] },
	{ url = "*/",              use = [ "reveal", "open" ] },
	# { name = "*/",              use = [ "reveal", "edit", "open" ] },
  { url = "{*.lua,*.txt,*.sh,.*.el,*.lisp,*.json,*.vim,*.py,*.kv,*sql}", use = [ "edit", "reveal" ] },
  { url = "{*.epub,*.fb2}",  use = [ "ebook", "open", "reveal" ] },
  { url = "{*.pdf,*.djvu}",  use = [ "pdf_djvu", "open", "reveal" ] },
  { url = "*.torrent",       use = [ "torrent", "open", "reveal" ] },

  { mime = "font/*",                      use = [ "font", "open", "reveal" ] },
  { mime = "application/vnd.ms-opentype", use = [ "font", "open", "reveal" ] },
	{ mime = "text/*",                      use = [ "edit", "reveal" ] },
	{ mime = "image/*",                     use = [ "image", "open", "reveal" ] },
  # { mime = "{audio,video}/*", use = [ "open", "video", "reveal" ] },
  { mime = "video/*",                     use = [ "video", "open", "reveal" ] },
  { mime = "audio/*",                     use = [ "audio", "open", "reveal" ] },
	{ mime = "inode/x-empty",               use = [ "edit", "reveal" ] },

	# { mime = "application/{,g}zip", use = [ "archive", "extract", "reveal" ] },
    # { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", use = [ "archive", "extract", "reveal" ] },
	{ mime = "application/{,g}zip",                            use = [ "archive", "reveal" ] },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", use = [ "archive", "reveal" ] },
	{ mime = "application/{json,x-ndjson}",                    use = [ "edit", "reveal" ] },
	{ mime = "*/javascript",                                   use = [ "edit", "reveal" ] },

	{ url = "*", use = [ "open", "reveal" ] },


	# Folder
#	{ mime = "folder/*", use = [ "edit", "open", "reveal" ] },
	# Text
#	{ mime = "text/*", use = [ "edit", "reveal" ] },
	# Image
#	{ mime = "image/*", use = [ "open", "reveal" ] },
	# Media
#	{ mime = "{audio,video}/*", use = [ "play", "reveal" ] },
	# Code
#	{ mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "reveal" ] },
	# Archive
#	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	# Empty file
#	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
	# Virtual file system
#	{ mime = "vfs/{absent,stale}", use = "download" },
	# Trash
#	{ mime = "trash/**", use = [ "open", "trash" ] },
	# Fallback
#	{ url = "*", use = [ "open", "reveal" ] },
]

[tasks]
file_workers     = 3
plugin_workers   = 5
fetch_workers    = 5
preload_workers  = 2
process_workers  = 5
bizarre_retry    = 3
image_alloc      = 536870912  # 512MB
image_bound      = [ 5000, 5000 ]
suppress_preload = false

[plugin]
fetchers = [
	# MIME-type
	{ url = "*/",         run = "mime.dir",    prio = "high", group = "mime" },
	{ url = "local://*",  run = "mime.local",  prio = "high", group = "mime" },
	{ url = "trash://*",  run = "mime.trash",  prio = "high", group = "mime" },
	{ url = "remote://*", run = "mime.remote", prio = "high", group = "mime" },
]
spotters = [
	# Multi-file
	{ mime = "multi/*", run = "multi" },
	# Folder
	{ mime = "folder/*", run = "folder" },
	# Code
	{ mime = "text/*", run = "code" },
	{ mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
	# Image
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# Virtual file system
	{ mime = "vfs/*", run = "vfs" },
	# Trash
	{ mime = "trash/**", run = "trash" },
	# Error
	{ mime = "null/*", run = "null" },
	# Fallback
	{ url = "*", run = "file" },
	{ url = "*/", run = "file" },
]
preloaders = [
	# Image
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Font
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
	# Trash
	{ mime = "trash/**", run = "trash" },
]
previewers = [
	{ mime = "folder/*", run = "folder" },
	# Code
	{ mime = "text/*", run = "code" },
	{ mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
	# JSON
	{ mime = "application/{json,ndjson}", run = "json" },
	# Image
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "archive" },
	{ mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "archive" },
	{ url = "*.{AppImage,appimage}", run = "archive" },
	# Virtual Disk / Disk Image
	{ mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "archive" },
	{ mime = "application/virtualbox-{vhd,vhdx}", run = "archive" },
	{ url = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "archive" },
	# Font
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
	# Empty file
	{ mime = "inode/empty", run = "empty" },
	# Virtual file system
	{ mime = "vfs/*", run = "vfs" },
	# Trash
	{ mime = "trash/**", run = "trash" },
	# Error
	{ mime = "null/*", run = "null" },
	# Fallback
	{ url = "*", run = "file" },
]

[input]
cursor_blink = false

# cd
cd_title  = "Change directory:"
cd_origin = "top-center"
cd_offset = [ 0, 2, 50, 3 ]

# create
create_title  = [ "Create:", "Create (dir):" ]
create_origin = "top-center"
create_offset = [ 0, 2, 50, 3 ]

# rename
rename_title  = "Rename:"
rename_origin = "hovered"
rename_offset = [ 0, 1, 50, 3 ]

# filter
filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [ 0, 2, 50, 3 ]

# find
find_title  = [ "Find next:", "Find previous:" ]
find_origin = "top-center"
find_offset = [ 0, 2, 50, 3 ]

# search
search_title  = "Search via {n}:"
search_origin = "top-center"
search_offset = [ 0, 2, 50, 3 ]

# shell
shell_title  = [ "Shell:", "Shell (block):" ]
shell_origin = "top-center"
shell_offset = [ 0, 2, 50, 3 ]

[confirm]
# trash
trash_title 	= "Trash {n} selected file{s}?"
trash_origin	= "center"
trash_offset	= [ 0, 0, 70, 20 ]

# delete
delete_title 	= "Permanently delete {n} selected file{s}?"
delete_origin	= "center"
delete_offset	= [ 0, 0, 70, 20 ]

# overwrite
overwrite_title  = "Overwrite file?"
overwrite_body   = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [ 0, 0, 50, 15 ]

# quit
quit_title  = "Quit?"
quit_body   = "There are unfinished tasks, quit anyway?\n(Open task manager with default key 'w')"
quit_origin = "center"
quit_offset = [ 0, 0, 50, 15 ]

[pick]
open_title  = "Open with:"
open_origin = "hovered"
# open_offset = [ 0, 1, 50, 7 ]
open_offset = [ 0, 1, 50, 30 ]
# [x, y, width, height]

[which]
sort_by      	 = "none"
sort_sensitive = false
sort_reverse 	 = false
sort_translit  = false
