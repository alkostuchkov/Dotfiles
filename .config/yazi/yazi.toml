# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
# ratio          = [ 1, 4, 3 ]
ratio          = [ 2, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse 	 = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "yes"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 100
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
    { run = 'ghostty -e vim "$@"', orphan = true, desc = "Neovim (Ghostty)", for = "unix" },
    { run = 'doom emacs "$@"', orphan = true, desc = "Doom Emacs", for = "unix" },
    { run = 'emacs "$@"', orphan = true, desc = "Emacsclient", for = "unix" },
    { run = 'wezterm start --always-new-process -e vim "$@"', orphan = true, desc = "Neovim (WezTerm)", for = "unix" },
	{ run = 'alacritty -e vim "$@"', orphan = true, desc = "Neovim (Alacritty)", for = "unix" },
	{ run = 'kitty -e vim "$@"', orphan = true, desc = "Neovim (Kitty)", for = "unix" },
	{ run = 'alacritty -e micro "$@"', orphan = true, desc = "micro", for = "unix" },
	{ run = 'code %*',    orphan = true, desc = "code",           for = "windows" },
	{ run = 'code -w %*', block = true,  desc = "code (block)",   for = "windows" },
]
open = [
	{ run = 'xdg-open "$1"',                desc = "System default", for = "linux" },
	{ run = 'open "$@"',                    desc = "Open", for = "macos" },
	{ run = 'start "" "%1"', orphan = true, desc = "Open", for = "windows" },
]
reveal = [
    { run = 'engrampa --add "$@"', block = true, desc = "Create archive (Engrampa)",  for = "linux" },
	{ run = 'ouch compress "$1" "$1.zip"', desc = "Create archive (ouch)",                for = "linux" },
	{ run = 'thunar "$(dirname "$1")"', desc = "Thunar", for = "linux" },
	# { run = 'xdg-open "$(dirname "$1")"', desc = "Other File Manager", for = "linux" },
	{ run = 'open -R "$1"', desc = "Reveal", for = "macos" },
	{ run = 'explorer /select, "%1"', orphan = true, desc = "Reveal", for = "windows" },
	{ run = '''exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
# extract = [
# 	{ run = 'unar "$1"', desc = "Extract here", for = "unix" },
# 	{ run = 'unar "%1"', desc = "Extract here", for = "windows" },
# ]
video = [
	{ run = 'smplayer "$@"',           orphan = true, desc = "SMplayer", for = "unix" },
	{ run = 'vlc "$@"',                orphan = true, desc = "VLC",      for = "unix" },
	{ run = 'mpv --force-window "$@"', orphan = true, desc = "mpv",      for = "unix" },
	{ run = 'avidemux "$@"',           orphan = true, desc = "Avidemux", for = "unix" },
	{ run = 'mpv --force-window "%1"', orphan = true,                    for = "windows" },
	{ run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
audio = [
	{ run = 'deadbeef "$@"',           orphan = true, desc = "DeaDBeeF",       for = "unix" },
	{ run = 'smplayer "$@"',           orphan = true, desc = "SMplayer",       for = "unix" },
	{ run = 'vlc "$@"',                orphan = true, desc = "VLC",            for = "unix" },
	{ run = 'mpv --force-window "$@"', orphan = true, desc = "mpv",            for = "unix" },
	{ run = 'audacity "$@"',           orphan = true, desc = "Audacity",       for = "unix" },
	{ run = 'soundconverter "$@"',     orphan = true, desc = "SoundConverter", for = "unix" },
	{ run = 'mpv --force-window "%1"', orphan = true,                          for = "windows" },
	{ run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
image = [
	{ run = 'qview "$@"', orphan = true, desc = "qView", for = "unix" },
	{ run = 'gimp "$@"',  orphan = true, desc = "GIMP",  for = "unix" },
	{ run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
torrent = [
	{ run = 'qbittorrent "$@"', orphan = true, desc = "qBittorrent", for = "unix" },
	{ run = 'tixati "$@"',      orphan = true, desc = "Tixati",      for = "unix" },
	{ run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
font = [
	{ run = 'gnome-font-viewer "$1"', orphan = true, desc = "Show font", for = "linux" },
]
archive = [
	{ run = 'engrampa "$1"',    desc = "Show archive (Engrampa)", for = "linux" },
    { run = 'engrampa -f "$@"', desc = "Extract here (Engrampa)", for = "linux" },
	{ run = 'ouch d -y "$@"',   desc = "Extract here (ouch)",     for = "unix" },
	{ run = 'unar "$1"',        desc = "Extract here (unar)",     for = "unix" },
	{ run = 'unar "%1"',        desc = "Extract here (unar)",     for = "windows" },
    { run = 'ouch d -y %*',     desc = "Extract here (ouch)",     for = "windows" },
]
pdf_djvu = [
	{ run = 'zathura "$1"',  orphan = true, desc = "Zathura",  for = "linux" },
	{ run = 'qpdfview "$1"', orphan = true, desc = "qpdfview", for = "linux" },
]
ebook = [
  { run = 'foliate "$1"',  orphan = true, desc = "Foliate",  for = "linux" },
	{ run = 'FBReader "$1"', orphan = true, desc = "FBReader", for = "linux" },
	{ run = 'bookworm "$1"', orphan = true, desc = "Bookworm", for = "linux" },
]
bulk-rename = [
    { run   = 'wezterm start --always-new-process -e vim "$@"', block = true },
]

[open]
# prepend_rules = [
# 	{ name = "bulk-rename.txt", use = [ "bulk-rename" ] },
# ]
rules = [
	# { name = "*/",              use = [ "open", "edit", "reveal" ] },
	{ name = "bulk-rename.txt", use = [ "bulk-rename" ] },
	{ name = "*/",              use = [ "reveal", "open" ] },
	# { name = "*/",              use = [ "reveal", "edit", "open" ] },
    { name = "{*.lua,*.txt,*.sh,.*.el,*.lisp}",   use = [ "edit", "reveal" ] },
    { name = "{*.epub,*.fb2}",  use = [ "ebook", "open", "reveal" ] },
    { name = "{*.pdf,*.djvu}",  use = [ "pdf_djvu", "open", "reveal" ] },
    { name = "*.torrent",       use = [ "torrent", "open", "reveal" ] },

    { mime = "font/*",                      use = [ "font", "open", "reveal" ] },
    { mime = "application/vnd.ms-opentype", use = [ "font", "open", "reveal" ] },
	{ mime = "text/*",                      use = [ "edit", "reveal" ] },
	{ mime = "image/*",                     use = [ "image", "open", "reveal" ] },
    # { mime = "{audio,video}/*", use = [ "open", "video", "reveal" ] },
    { mime = "video/*",                     use = [ "video", "open", "reveal" ] },
    { mime = "audio/*",                     use = [ "audio", "open", "reveal" ] },
	{ mime = "inode/x-empty",               use = [ "edit", "reveal" ] },

	# { mime = "application/{,g}zip", use = [ "archive", "extract", "reveal" ] },
    # { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", use = [ "archive", "extract", "reveal" ] },
	{ mime = "application/{,g}zip",                            use = [ "archive", "reveal" ] },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", use = [ "archive", "reveal" ] },
	{ mime = "application/{json,x-ndjson}",                    use = [ "edit", "reveal" ] },
	{ mime = "*/javascript",                                   use = [ "edit", "reveal" ] },

	{ name = "*", use = [ "open", "reveal" ] },
]

[tasks]
micro_workers    = 10
macro_workers    = 10
bizarre_retry    = 3
image_alloc      = 536870912  # 512MB
image_bound      = [ 5000, 5000 ]
suppress_preload = false

[plugin]
fetchers = [
	# Mimetype
	{ id = "mime", name = "*", run = "mime", prio = "high" },
]
spotters = [
	{ name = "*/", run = "folder" },
	# Code
	{ mime = "text/*", run = "code" },
	{ mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
	# Image
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# Fallback
	{ name = "*", run = "file" },
]
preloaders = [
	# Image
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Font
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
]
prepend_previewers = [
	# Archive previewer
	{ mime = "application/*zip",            run = "ouch" },
	{ mime = "application/x-tar",           run = "ouch" },
	{ mime = "application/x-bzip2",         run = "ouch" },
	{ mime = "application/x-7z-compressed", run = "ouch" },
	{ mime = "application/x-rar",           run = "ouch" },
	{ mime = "application/vnd.rar",         run = "ouch" },
	{ mime = "application/x-xz",            run = "ouch" },
	{ mime = "application/xz",              run = "ouch" },
	{ mime = "application/x-zstd",          run = "ouch" },
	{ mime = "application/zstd",            run = "ouch" },
	{ mime = "application/java-archive",    run = "ouch" },
]
previewers = [
	{ name = "*/", run = "folder" },
	# Code
	{ mime = "text/*", run = "code" },
	{ mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
	# JSON
	{ mime = "application/{json,ndjson}", run = "json" },
	# Image
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "archive" },
	{ mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "archive" },
	{ name = "*.{AppImage,appimage}", run = "archive" },
	# Virtual Disk / Disk Image
	{ mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "archive" },
	{ mime = "application/virtualbox-{vhd,vhdx}", run = "archive" },
	{ name = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "archive" },
	# Font
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
	# Empty file
	{ mime = "inode/empty", run = "empty" },
	# Fallback
	{ name = "*", run = "file" },
]

[input]
cursor_blink = false

# cd
cd_title  = "Change directory:"
cd_origin = "top-center"
cd_offset = [ 0, 2, 50, 3 ]

# create
create_title  = [ "Create:", "Create (dir):" ]
create_origin = "top-center"
create_offset = [ 0, 2, 50, 3 ]

# rename
rename_title  = "Rename:"
rename_origin = "hovered"
rename_offset = [ 0, 1, 50, 3 ]

# filter
filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [ 0, 2, 50, 3 ]

# find
find_title  = [ "Find next:", "Find previous:" ]
find_origin = "top-center"
find_offset = [ 0, 2, 50, 3 ]

# search
search_title  = "Search via {n}:"
search_origin = "top-center"
search_offset = [ 0, 2, 50, 3 ]

# shell
shell_title  = [ "Shell:", "Shell (block):" ]
shell_origin = "top-center"
shell_offset = [ 0, 2, 50, 3 ]

[confirm]
# trash
trash_title 	= "Trash {n} selected file{s}?"
trash_origin	= "center"
trash_offset	= [ 0, 0, 70, 20 ]

# delete
delete_title 	= "Permanently delete {n} selected file{s}?"
delete_origin	= "center"
delete_offset	= [ 0, 0, 70, 20 ]

# overwrite
overwrite_title   = "Overwrite file?"
overwrite_content = "Will overwrite the following file:"
overwrite_origin  = "center"
overwrite_offset  = [ 0, 0, 50, 15 ]

# quit
quit_title   = "Quit?"
quit_content = "The following tasks are still running, are you sure you want to quit?"
quit_origin  = "center"
quit_offset  = [ 0, 0, 50, 15 ]

[pick]
open_title  = "Open with:"
open_origin = "hovered"
# open_offset = [ 0, 1, 50, 7 ]
open_offset = [ 0, 1, 50, 30 ]
# [x, y, width, height]

[which]
sort_by      	 = "none"
sort_sensitive = false
sort_reverse 	 = false
sort_translit  = false

