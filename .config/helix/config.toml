# theme = "peachpuff"
# theme = "tokyonight_moon"
# theme = "ayu_mirage"
# theme = "catppuccin_mocha"
theme = "adwaita-dark"

[editor]
scrolloff = 999
true-color = true
line-number = "relative"
mouse = false
rulers = [80]
cursorline = true
cursorcolumn = true
bufferline = "multiple"
continue-comments = false   

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = [
  "mode",
  "spinner",
  "version-control",
  "read-only-indicator",
  "file-name",
  "file-modification-indicator",
]
center = ["diagnostics", "workspace-diagnostics"]
right = [
  # "diagnostics",
  "selections",
  "file-encoding",
  "file-line-ending",
  "file-type",
  "position-percentage",
  "position"
]
separator = "│"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.file-picker]
hidden = false

[editor.whitespace.render]
# space = "all"
tab = "all"
# newline = "all"

[editor.indent-guides]
render = true
character = "╎" # Some characters that work well: "▏", "╎", "┆", "┊"
skip-levels = 1
# skip-levels = 0

[editor.soft-wrap]
enable = true

# [editor.lsp]
# display-messages = true
# display-inlay-hints = true

[keys.select]
"{" = "goto_prev_paragraph"
"}" = "goto_next_paragraph"

[keys.normal]
C-p = ["move_line_up", "scroll_up"]
C-n = ["move_line_down", "scroll_down"]
esc = ["collapse_selection", "keep_primary_selection"]
"{" = "goto_prev_paragraph"
"}" = "goto_next_paragraph"
