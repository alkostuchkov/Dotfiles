[bar.default]
center = []
end = [
    "Updates",
    "cpu",
    "sysmon",
    "keyboard_layout",
    "volume",
    "brightness",
    "network",
    "tray",
    "clipboard",
    "battery",
    "clock",
    "session"
]
font_family = "Ubuntu"
margin_edge = 7
margin_ends = 7
scale = 1.1000000089406967
start = [ "launcher", "workspaces", "active_window", "media" ]

# [brightness]
# enable_ddcutil = false
# ignore_mmids = []
# minimum_brightness = 0.0
# sync_all_monitors = false
#
#     [brightness.monitor.DP-1]
#     backend = "ddcutil"
#
#     [brightness.monitor.eDP-1]
#     backend = "backlight"
#     backlight_device = "radeon_bl0"

[calendar]
enabled = true

[desktop_widgets]
enabled = false

[dock]
auto_hide = true
icon_size = 35

[location]
address = "Homyel"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@LVDS-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@LVDS-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 683.0
    cy = 649.0
    output = "LVDS-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@LVDS-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[shell]
font_family = "Ubuntu"
settings_show_advanced = true
ui_scale = 1.300000011920929

    [shell.panel]
    open_near_click_clipboard = true

    [shell.screenshot]
    directory = "/home/alexander/Pictures/screenshots"

[theme]
builtin = "Tokyo-Night"
mode = "dark"

[wallpaper]
directory = "/home/alexander/Pictures/Wallpapers/NewWallpapers"

    [wallpaper.default]
    path = "/home/alexander/Pictures/Wallpapers/NewWallpapers/0314.jpg"

    [wallpaper.last]
    path = "/home/alexander/Pictures/Wallpapers/NewWallpapers/0314.jpg"

[widget.Updates]
command = "/home/alexander/.config/niri/scripts/show_updates.sh"
glyph = "cloud"
middle_command = "alacritty --hold -e sudo xbps-install -Su"
tooltip = "Available updates"
type = "custom_button"

[widget.battery]
display_mode = "graphic"
hide_when_full = true
show_label = false

[widget.keyboard_layout]
display = "full"
font_family = "Ubuntu"
glyph = "keyboard-filled"
show_icon = false

    [widget.keyboard_layout.custom_labels]
    Belarusian = "BE"
    "Belarusian (Latin)" = "BEŁ"
    Russian = "RU"

[widget.media]
font_family = "Ubuntu"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.sysmon]
stat = "ram_pct"
