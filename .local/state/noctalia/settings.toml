[bar.default]
center = [ "media" ]
end = [
    "Updates",
    "cpu",
    "temp",
    "sysmon",
    "keyboard_layout",
    "volume",
    "brightness",
    "network",
    "tray",
    "clipboard",
    "battery",
    "date",
    "clock"
]
font_family = "Ubuntu"
margin_edge = 7
margin_ends = 7
scale = 1.1000000089406967
start = [ "workspaces", "taskbar", "active_window" ]

    [bar.default.dead_zone]
    command = "noctalia msg panel-toggle launcher"
    middle_command = "exec kitty"
    scroll_down_command = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05- -l 1.0"
    scroll_up_command = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0"

[calendar]
enabled = true

[desktop_widgets]
enabled = false

[dock]
auto_hide = true
icon_size = 35

[location]
address = "Homyel"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@LVDS-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@LVDS-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 683.0
    cy = 649.0
    output = "LVDS-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@LVDS-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[nightlight]
enabled = true

[shell]
font_family = "Ubuntu"
settings_show_advanced = true
ui_scale = 1.300000011920929

    [shell.panel]
    open_near_click_clipboard = true

    [shell.screenshot]
    directory = "/home/alexander/Pictures/screenshots"

[theme]
builtin = "Tokyo-Night"
mode = "dark"

[wallpaper]
directory = "/home/alexander/Pictures/Wallpapers/NewWallpapers"

    [wallpaper.default]
    path = "/home/alexander/Pictures/Wallpapers/NewWallpapers/0314.jpg"

    [wallpaper.last]
    path = "/home/alexander/Pictures/Wallpapers/NewWallpapers/0314.jpg"

[widget.Updates]
capsule = true
command = "/home/alexander/.config/niri/scripts/show_updates.sh"
glyph = "cloud"
middle_command = "alacritty --hold -e sudo xbps-install -Su"
tooltip = "Available updates"
type = "custom_button"

[widget.active_window]
capsule = true

[widget.audio_visualizer]
capsule = true

[widget.battery]
capsule = true
display_mode = "graphic"
hide_when_full = true
show_label = false

[widget.brightness]
capsule = true

[widget.clock]
capsule = true
format = "{:%H:%M:%S}"

[widget.cpu]
capsule = true

[widget.date]
capsule = true
format = "{:%d %b %y, %a}"

[widget.keyboard_layout]
capsule = true
display = "full"
font_family = "Ubuntu"
glyph = "keyboard-filled"
show_icon = false

    [widget.keyboard_layout.custom_labels]
    Belarusian = "BE"
    "Belarusian (Latin)" = "BEŁ"
    Russian = "RU"

[widget.media]
capsule = true
font_family = "Ubuntu"
hide_when_no_media = true
max_length = 120
min_length = 70
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.session]
capsule = true

[widget.sysmon]
capsule = true
stat = "ram_pct"

[widget.taskbar]
capsule = true
only_active_workspace = true

[widget.temp]
capsule = true

[widget.volume]
capsule = true