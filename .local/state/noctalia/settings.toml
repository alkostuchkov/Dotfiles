config_version = 15

[bar.default]
center = []
end = [
    "Updates",
    "cpu",
    "temp",
    "sysmon",
    "keyboard_layout",
    "volume",
    "brightness",
    "network",
    "tray",
    "clipboard",
    "battery",
    "date",
    "clock"
]
font_family = "Ubuntu"
margin_edge = 5
margin_ends = 5
scale = 1.1000000089406967
start = [ "workspaces", "taskbar", "active_window", "media" ]

    [bar.default.dead_zone.actions]
    left = "exec noctalia msg panel-toggle launcher"
    middle = "exec exec kitty"
    scroll_down = "exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05- -l 1.0"
    scroll_up = "exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0"

[calendar]
enabled = true

[desktop_widgets]
enabled = false

[dock]
auto_hide = true
icon_size = 35

[location]
address = "Homyel"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@LVDS-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@LVDS-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 683.0
    cy = 649.0
    output = "LVDS-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@LVDS-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[shell]
font_family = "Ubuntu"
settings_show_advanced = true
ui_scale = 1.300000011920929

    [shell.keyboard_layout.custom_labels]
    Belarusian = "BE"
    "Belarusian (Latin)" = "BEŁ"
    Russian = "RU"

    [shell.panel]
    open_near_click_clipboard = true

    [shell.screenshot]
    directory = "/home/alexander/Pictures/screenshots"

[theme]
builtin = "Tokyo-Night"
mode = "dark"

[wallpaper]
directory = "/home/alexander/Pictures/Wallpapers/NewWallpapers"

    [wallpaper.default]
    path = "/home/alexander/Pictures/Wallpapers/NewWallpapers/0314.jpg"

    [wallpaper.last]
    path = "/home/alexander/Pictures/Wallpapers/NewWallpapers/0314.jpg"

[widget.Updates]
glyph = "cloud"
tooltip = "Available updates"
type = "custom_button"

    [widget.Updates.actions]
    left = "exec /home/alexander/.config/niri/scripts/show_updates.sh"
    middle = "exec alacritty --hold -e sudo xbps-install -Su"

[widget.active_window]
capsule = true

[widget.audio_visualizer]
capsule = true

[widget.battery]
display_mode = "graphic"
hide_when_full = true
hide_when_plugged = true

[widget.clock]
format = "{:%H:%M:%S}"

[widget.date]
format = "{:%d %b, %a}"

[widget.keyboard_layout]
display = "full"
font_family = "Ubuntu"
glyph = "keyboard-filled"
show_glyph = false

[widget.media]
capsule = true
font_family = "Ubuntu"
hide_when_no_media = true
max_length = 120
min_length = 70
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.session]
capsule = true

[widget.sysmon]
stat = "ram_pct"

[widget.taskbar]
capsule = true
only_active_workspace = true

[widget.temp]
highlight_color = "on_surface_variant"